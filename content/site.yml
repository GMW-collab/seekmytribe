# Site-wide settings that staff may need to change.

# Services the site depends on. Used in the privacy notice.
# Mark verified: true once the account exists and a data processing agreement is in place.
services:
  email_provider:
    value: Resend (resend.com)
    verified: false
    source: Suggested in the build. Not yet set up.
    launch: true
  hosting_provider:
    value: Cloudflare (cloudflare.com)
    verified: false
    source: Chosen 22 Oct 2026. Mark verified once the Worker is deployed.
    launch: true

# Online donations through Stripe Payment Links (Stripe hosts the payment page,
# so card details never touch this website). Create the links in the Stripe
# dashboard with "customers choose what to pay", then paste them here.
# Until a link is filled in, the Donate page says online giving opens soon.
donations:
  one_off_url: ""     # e.g. https://donate.stripe.com/...
  monthly_url: ""     # optional, a recurring Payment Link
  # Optional suggested amounts shown on the page. Only add examples once you've
  # costed them, e.g. "£15 covers a shared meal for one person".
  examples: []

# Social links appear in the footer only when a URL is filled in.
social:
  - name: Instagram
    url: ""
  - name: Facebook
    url: ""
  - name: LinkedIn
    url: ""
