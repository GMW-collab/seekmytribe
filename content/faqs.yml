# Frequently asked questions, grouped. Answers may use Markdown.
- group: Taking part
  items:
    - q: Do I need to be outgoing to come along?
      a: >-
        No. Our activities are built around doing something together, so there's
        always something to focus on besides conversation. Lots of people come on
        their own and say very little the first time. That's completely fine.
    - q: Can I come on my own?
      a: >-
        Yes. Most people do. The organiser will say hello and introduce you to the
        group if you'd like them to.
    - q: Is there an age limit?
      a: >-
        Each activity says who it is for. Most are for adults. Any activity
        involving children or young people will say so clearly, and will have
        the right safeguarding arrangements in place before it runs.
    - q: What does it cost?
      a: >-
        Each activity lists its cost. We aim to keep as many as possible free or
        pay-what-you-can, and we don't want cost to stop anyone coming. If it
        would, [get in touch](/contact/) and we'll talk about it in confidence.
    - q: Do I need a smartphone or the internet?
      a: >-
        No. You can [contact us](/contact/) and we'll help you find something and
        tell you the details in whatever way suits you.
    - q: What if I sign up and then can't come?
      a: >-
        Just let the organiser know if you can, so someone else can have your
        place. There's no penalty and no need to explain.
- group: Accessibility
  items:
    - q: How do I know if an activity will work for my access needs?
      a: >-
        Every activity page lists what we know about access, and says plainly when
        something hasn't been checked yet. If you need to know more, or need an
        adjustment, [ask us](/contact/) before you come.
    - q: Can I bring someone to support me?
      a: >-
        Yes. Carers and support workers are welcome and don't need to pay.
- group: About us
  items:
    - q: Is Seek My Tribe a therapy or mental health service?
      a: >-
        No. We run community activities. They can be good for wellbeing, but
        they aren't therapy and our organisers aren't clinicians. If you're
        struggling, your GP is a good first step. If you're in crisis, call
        Samaritans free on 116 123 at any time, or call 999 in an emergency.
    - q: Is Seek My Tribe a charity?
      a: >-
        No. We are a community interest company (CIC): a not-for-profit business
        that exists for community benefit and has its assets locked for that
        purpose. CICs cannot be registered charities, so donations to us are
        not eligible for Gift Aid.
    - q: Is this a dating service?
      a: >-
        No. Our activities are about friendship and community. We ask everyone to
        follow our [participation guidelines](/participation-guidelines/).
